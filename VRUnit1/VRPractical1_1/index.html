<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="red"></a-box>
      <!-- wheels -->
      <a-torus position="0 1.25 -5" radius="0.7.5" color="black"></a-torus>
      <a-cylinder position="0 1.25 -5" rotation="0 90 90" radius="0.5" height="0.5" color="gray"></a-cylinder>
      <!-- Axel -->
      <a-cylinder position="0 1.25 -9" rotation="0 90 90" radius="0.25" height="2" color="gray"></a-cylinder>
      <a-box position="0 1.25 -6" rotation="0 0 0" height="1" width="0.25" depth="0.25" color="gray"></a-box>
      <a-box position="0.4 1.6 -6.5" rotation="0 90 90" height="1.25" width="0.3" depth="0.25" color="black"></a-box>
      <a-box position="0 1.25 -7" rotation="0 0 0" height="1" width="0.25" depth="0.25" color="gray"></a-box>
      <a-cylinder position="0.25 1.6 -7" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="-0.25 1.6 -7" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="0.25 1.6 -6" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="-0.25 1.6 -6" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="0.25 0.9 -7" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="-0.25 0.9 -7" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="0.25 0.9 -6" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="-0.25 0.9 -6" rotation="0 0 90" radius="0.2" height="0.35" width="0.6" depth="0.3" color="gray"></a-cylinder>
      <a-cylinder position="0 1.25 -5.6" rotation="0 90 90" radius="0.5" height="0.2" width="0.2" depth="0.2" color="red"></a-cylinder>
      






      <a-plane position="0 0 -4" rotation="-90 0 0" width="40" height="40" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
