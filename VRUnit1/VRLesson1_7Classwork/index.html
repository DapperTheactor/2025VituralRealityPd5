<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
    <!-- Pacman -->
   <a-entity class="pacman">
    <a-sphere position="0 2.25 -6" radius="1.25" color="yellow" side="double"></a-sphere>
    <a-sphere position="0 2.25 -5.9" rotation="45 0 0" radius="1.24" color="black" side="double" theta-start="0" theta-length="90" phi-start="0" phi-length="180" ></a-sphere>
   </a-entity>
    <!-- red ghost but it look like a plug   -->
   <a-entity class="ghost">
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5 2 -6" theta-start="0" theta-length="90" radius="1.1" color="red" side="double"></a-sphere>
    <a-cylinder position="-5 1.6 -6" radius="1.1" width="1" height="0.8" color="red" side="double"  rotation="0 0 0" ></a-cylinder>
    <a-cylinder position="-5.6 0.75 -6.4" radius="0.25" height="1" color="red" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-4.4 0.75 -6.4" radius="0.25" height="1" color="red" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-5 0.75 -5.6" radius="0.25" height="1" color="red" segments-radial="3" rotation="0 0 0"></a-cylinder>
   </a-entity>
   <!-- blue ghost but it look like a plug   -->
   <a-entity class="ghost" position="-4.3 0. -0">
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5 2 -6" theta-start="0" theta-length="90" radius="1.1" color="blue" side="double"></a-sphere>
    <a-cylinder position="-5 1.6 -6" radius="1.1" width="1" height="0.8" color="blue" side="double"  rotation="0 0 0" ></a-cylinder>
    <a-cylinder position="-5.6 0.75 -6.4" radius="0.25" height="1" color="blue" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-4.4 0.75 -6.4" radius="0.25" height="1" color="blue" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-5 0.75 -5.6" radius="0.25" height="1" color="blue" segments-radial="3" rotation="0 0 0"></a-cylinder>
   </a-entity>
   <!-- pink ghost but it look like a plug   -->
   <a-entity class="ghost" position="-4.3 0. 3">
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5 2 -6" theta-start="0" theta-length="90" radius="1.1" color="pink" side="double"></a-sphere>
    <a-cylinder position="-5 1.6 -6" radius="1.1" width="1" height="0.8" color="pink" side="double"  rotation="0 0 0" ></a-cylinder>
    <a-cylinder position="-5.6 0.75 -6.4" radius="0.25" height="1" color="pink" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-4.4 0.75 -6.4" radius="0.25" height="1" color="pink" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-5 0.75 -5.6" radius="0.25" height="1" color="pink" segments-radial="3" rotation="0 0 0"></a-cylinder>
   </a-entity>
   <!-- orange ghost but it look like a plug   -->
   <a-entity class="ghost" position="0 0. 3">
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-4.3 2.25 -5.2" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"  radius="1.25" color="white" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5.6 2.25 -5.1" radius="0.3"theta-start="0" theta-length="90" phi-start="0" phi-length="1800" radius="1.25" color="blue" side="double" rotation="90 0 0" ></a-sphere>
    <a-sphere position="-5 2 -6" theta-start="0" theta-length="90" radius="1.1" color="orange" side="double"></a-sphere>
    <a-cylinder position="-5 1.6 -6" radius="1.1" width="1" height="0.8" color="orange" side="double"  rotation="0 0 0" ></a-cylinder>
    <a-cylinder position="-5.6 0.75 -6.4" radius="0.25" height="1" color="orange" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-4.4 0.75 -6.4" radius="0.25" height="1" color="orange" segments-radial="3" rotation="0 0 0"></a-cylinder>
    <a-cylinder position="-5 0.75 -5.6" radius="0.25" height="1" color="orange" segments-radial="3" rotation="0 0 0"></a-cylinder>
   </a-entity>
    <!-- world -->
      <a-plane position="0 0 -4"  rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
